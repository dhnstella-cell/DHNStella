<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Админ-панель — DHN Stella</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"><style>:root{--em:#0B4A2B;--gold:#C9A24D;--gg:linear-gradient(135deg,#F0DC9A,#C9A24D,#8C6A23)}
*{box-sizing:border-box;margin:0}body{font:300 16px/1.6 Jost,sans-serif;background:linear-gradient(160deg,#F4D9CB,#F8E7DE);min-height:100vh;color:#3b3a36}
h1,h2{font-family:'Cormorant Garamond',serif;color:var(--em)}h2{font-size:2rem;margin-bottom:16px}
#login{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}#login[hidden],#app[hidden],[hidden]{display:none!important}
.box,.card{background:rgba(255,255,255,.65);backdrop-filter:blur(10px);border:1px solid var(--gold);border-radius:22px;padding:28px;box-shadow:0 12px 34px rgba(120,70,50,.15);animation:in .8s ease both}
.box{width:100%;max-width:400px;text-align:center;display:grid;gap:14px}.box img{width:110px;height:110px;border-radius:50%;object-fit:cover;margin:auto;border:2px solid var(--gold)}
@keyframes in{from{opacity:0;transform:translateY(20px)}}
input,select{width:100%;padding:14px;border-radius:12px;border:1px solid var(--gold);background:#fff;font:inherit;margin-bottom:10px}
.b{padding:14px 24px;border-radius:40px;border:1.5px solid var(--gold);background:var(--em);color:#fff;font:500 .8rem Jost;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;width:100%}.b.s{width:auto;padding:8px 14px}
#err{color:#b3261e}.or{color:#999}#g{display:flex;justify-content:center}
aside{position:fixed;z-index:9;background:var(--em);display:flex;gap:4px}aside img{display:none;width:72px;height:72px;border-radius:50%;margin:18px auto;border:2px solid var(--gold)}
aside a{color:#fff;text-decoration:none;padding:12px 16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:.7rem;flex:1;transition:background .4s}aside a.on,aside a:hover{background:rgba(201,162,77,.3)}
aside{left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0)}main{padding:20px 16px 100px}
@media(min-width:800px){aside{top:0;bottom:0;right:auto;width:200px;flex-direction:column;justify-content:flex-start}aside img{display:block}aside a{flex-direction:row;gap:10px;flex:none;font-size:.95rem}main{margin-left:200px;padding:40px}}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.num{font:700 2.6rem 'Cormorant Garamond';background:var(--gg);-webkit-background-clip:text;color:transparent}
.row{display:grid;gap:8px;padding:14px 0;border-bottom:1px dashed var(--gold)}.row a{color:var(--em)}
.st{padding:4px 12px;border-radius:20px;font-size:.75rem;color:#fff;display:inline-block}
.th{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:16px}.th div{position:relative}.th img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:1px solid var(--gold)}.th button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:26px;height:26px;background:#b3261e;color:#fff;cursor:pointer}
</style></head><body>

<main><section id="dash"></section><section id="req" hidden></section><section id="gal" hidden></section><section id="set" hidden></section></main></div>
<script src="https://accounts.google.com/gsi/client" async defer></script><script>// === НАСТРОЙКИ ===
const GOOGLE_CLIENT_ID='[GOOGLE_CLIENT_ID]';          // из console.cloud.google.com → Credentials → OAuth Client ID (Web)
const OWNER_EMAILS=['dhnstella@gmail.com'];   // кому разрешён вход
const PW_HASH='4b906784038005caa31c9e17a646cab206cc142baaaa353b0098563174d6531e';  // SHA-256 пароля
const hx=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},put=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const COL={'Новая':'#c9a24d','Подтверждена':'#0B4A2B','Выполнена':'#4a7fb5','Отменена':'#b3261e'};
function enter(email){sessionStorage.setItem('dhn_auth',email);$('#login').hidden=true;$('#app').hidden=false;render();idle()}
function idle(){let t;const r=()=>{clearTimeout(t);t=setTimeout(()=>{sessionStorage.clear();location.reload()},15*60e3)};['click','keydown','touchstart'].forEach(e=>addEventListener(e,r));r()}
$('#lf').onsubmit=async e=>{e.preventDefault();const f=+sessionStorage.fails||0;if(f>=5){$('#err').textContent='Слишком много попыток. Подождите.';return}
 if(OWNER_EMAILS.includes($('#em').value.trim().toLowerCase())&&await hx($('#pw').value)===PW_HASH)enter($('#em').value.trim().toLowerCase());else{sessionStorage.fails=f+1;$('#err').textContent='Неверный email или пароль'}};
function gcb(r){const p=JSON.parse(decodeURIComponent(escape(atob(r.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))));
 if(OWNER_EMAILS.includes(p.email.toLowerCase()))enter(p.email);else $('#err').textContent='Этот Google-аккаунт не имеет доступа'}
addEventListener('load',()=>{if(window.google&&!GOOGLE_CLIENT_ID.includes('[')){google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:gcb});google.accounts.id.renderButton($('#g'),{theme:'outline',size:'large',text:'signin_with',locale:'ru'})}else $('#g').innerHTML='<small>Вход через Google включится после вставки GOOGLE_CLIENT_ID в admin.js</small>'});
if(sessionStorage.dhn_auth)enter(sessionStorage.dhn_auth);
$$('aside a[data-t]').forEach(a=>a.onclick=()=>{$$('aside a').forEach(x=>x.classList.remove('on'));a.classList.add('on');$$('main section').forEach(s=>s.hidden=s.id!==a.dataset.t);render()});
$('#out').onclick=()=>{sessionStorage.clear();location.reload()};
function render(){const R=get('dhn_req',[]),day=new Date().toDateString();
 const n=(ms)=>R.filter(r=>Date.now()-new Date(r.created)<ms).length;
 $('#dash').innerHTML=`<h2>Главная</h2><div class="grid"><div class="card"><div class="num">${R.filter(r=>new Date(r.created).toDateString()===day).length}</div>Заявок сегодня</div><div class="card"><div class="num">${n(7*864e5)}</div>За неделю</div><div class="card"><div class="num">${n(30*864e5)}</div>За месяц</div><div class="card"><div class="num">${R.filter(r=>r.status==='Новая').length}</div>Новых</div></div>`;
 $('#req').innerHTML=`<h2>Заявки</h2><div class="card">${R.length?R.map((r,i)=>`<div class="row"><b>${esc(r.name)}</b><span>${esc(r.service)} · ${esc(r.date||'без даты')}</span><span>${esc(r.comment)}</span><span><a href="tel:${esc(r.phone)}">📞 ${esc(r.phone)}</a> · <a target="_blank" href="https://wa.me/${esc(r.phone).replace(/\D/g,'')}">WhatsApp</a></span><select data-i="${i}" style="background:${COL[r.status]};color:#fff">${Object.keys(COL).map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></div>`).join(''):'Пока заявок нет. Они появятся после отправки формы на сайте.'}</div>`;
 $$('#req select').forEach(s=>s.onchange=()=>{R[s.dataset.i].status=s.value;put('dhn_req',R);render()});
 const G=get('dhn_gallery',[]);
 $('#gal').innerHTML=`<h2>Галерея До/После</h2><div class="card"><select id="gc"><option value="b">Брови</option><option value="g">Губы</option><option value="v">Веки</option><option value="l">Ламинирование</option></select><input id="gf" type="file" accept="image/*" multiple><button class="b" id="gu">Загрузить фото</button><div class="th">${G.map((p,i)=>`<div><img src="${p.src}" alt=""><button data-d="${i}">×</button></div>`).join('')}</div></div>`;
 $('#gu').onclick=async()=>{const fs=[...$('#gf').files];for(const f of fs)G.push({c:$('#gc').value,src:await shrink(f)});put('dhn_gallery',G);render()};
 $$('[data-d]').forEach(b=>b.onclick=()=>{G.splice(b.dataset.d,1);put('dhn_gallery',G);render()});
 $('#set').innerHTML=`<h2>Настройки</h2><div class="card"><p><b>Вы вошли как:</b> ${esc(sessionStorage.dhn_auth||'')}</p><p style="margin-top:10px">Автовыход — через 15 минут бездействия. Пароль и Google-доступ меняются в начале файла admin.js.</p></div>`}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shrink(f){return new Promise(res=>{const i=new Image;i.onload=()=>{const k=Math.min(1,1000/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};i.src=URL.createObjectURL(f)})}
</script></body></html>
